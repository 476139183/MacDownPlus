[package]
name = "macdownplus"
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[lib]
name = "macdownplus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
macdown-core = { path = "../crates/markdown-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
handlebars = "6"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSString", "NSURL", "NSArray", "NSDictionary", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSMenuItem", "NSPrintInfo", "NSPrintOperation", "NSPageLayout", "NSFontManager"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }
objc2-pdf-kit = "0.3"
