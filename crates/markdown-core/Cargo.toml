[package]
name = "macdown-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
ammonia = "4.2"
base64 = "0.22"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
html-escape = "0.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
